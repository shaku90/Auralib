<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auralib</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #1e1b4b; margin: 0; padding: 0; }
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(to right, #0f172a, #1e1b4b, #0f172a);
        color: #ffffff;
        font-family: sans-serif;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-left-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <h2 style="margin: 0; font-size: 1.25rem; font-weight: 600; tracking: tight;">Auralib</h2>
        <p style="margin: 6px 0 0 0; font-size: 0.875rem; color: #a5b4fc;">Cargando...</p>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
